<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세(탁기) Key</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/highland-cow.jpg') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-heading {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 0 0 24px;
        }
        .page-heading h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2rem); }
        .title-photo {
            width: 76px;
            height: 76px;
            flex: 0 0 auto;
            object-fit: cover;
            object-position: 50% 55%;
            border-radius: 14px;
        }
        @media (max-width: 480px) {
            .page-heading { gap: 12px; }
            .title-photo { width: 60px; height: 60px; border-radius: 12px; }
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .active {
            background-color: #d4edda;
            color: #155724;
        }

        .inactive {
            background-color: #eeeeee;
            color: #666666;
        }

        .info {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            padding: 15px 25px;
            border: 1px solid #ddd;
            border-radius: 10px;
            min-width: 150px;
        }

        .card strong {
            display: block;
            margin-bottom: 8px;
        }

        canvas {
            max-height: 500px;
        }
    </style>
    <link rel="stylesheet" href="/static/notifications.css">
    <link rel="stylesheet" href="/static/dashboard.css">
</head>

<body>

<header class="page-heading">
    <h1>세(탁기) Key</h1>
    <img class="title-photo" src="/static/images/highland-cow.jpg" alt="" width="76" height="76">
</header>

<section class="dashboard-panel device-panel" aria-labelledby="deviceTitle">
    <div class="panel-heading">
        <h2 id="deviceTitle">기기 상태</h2>
        <span id="status" class="status inactive">데이터 대기 중</span>
    </div>
    <p class="device-updated">마지막 수신 <strong id="lastUpdated">--</strong></p>
    <div class="info">
        <div class="card">
            <strong>온도</strong>
            <div id="temperature">--</div>
        </div>
        <div class="card">
            <strong>대기압</strong>
            <div id="pressure">--</div>
        </div>
    </div>
    <details class="device-details">
        <summary>연결 상세 정보</summary>
        <p>실시간 연결: <strong id="connectionStatus">연결 중…</strong><br>
        데이터 수신: <strong id="consumerStatus">준비 중…</strong></p>
    </details>
    <p id="replayNotice" aria-live="polite"></p>
</section>

<section id="notificationPanel" aria-labelledby="notificationTitle">
    <div class="notification-header">
        <h2 id="notificationTitle">세탁 알림</h2>
        <p id="cycleStatus" aria-live="polite">상태 확인 중</p>
    </div>
    <p class="notification-intro">수신자를 한 번 저장하면 다음 빨래도 자동으로 알려드려요. 필요 없을 때는 알림을 꺼두세요.</p>
    <p id="cycleWarning" role="status" hidden></p>
    <form id="notificationLogin">
        <label for="notificationPassword">비밀번호 4자리</label>
        <div class="notification-login-row">
            <input id="notificationPassword" type="password" autocomplete="current-password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" required>
            <button class="notification-primary" type="submit">알림 설정</button>
        </div>
    </form>
    <form id="notificationPicker" hidden>
        <fieldset id="notificationNames"></fieldset>
        <p id="notificationHint"></p>
        <div class="notification-actions">
            <button id="notificationSave" class="notification-primary" type="submit">알림 켜기</button>
            <button id="cycleCancel" type="button">알림 끄기</button>
        </div>
        <div class="notification-session">
            <span id="notificationCountdown" role="timer" hidden></span>
            <button id="notificationLogout" class="notification-link" type="button">잠그기</button>
        </div>
    </form>
    <p id="notificationMessage" role="status" aria-live="polite"></p>
    <details class="notification-details">
        <summary>상세 정보</summary>
        <p id="cycleDetails"></p>
        <p id="notificationCurrent" aria-live="polite"></p>
        <div class="notification-detail-actions">
            <button id="notificationRefresh" class="notification-link" type="button">상태 새로고침</button>
            <button id="cycleDownload" class="notification-link" type="button" hidden>기록 다운로드</button>
        </div>
    </details>
</section>

<section class="dashboard-panel graph-panel" aria-labelledby="graphTitle">
    <h2 id="graphTitle">움직임과 진동</h2>
    <p class="graph-intro">세탁기의 움직임과 진동을 5초 단위로 보여드려요.</p>
    <div class="history-controls">
        <label for="historyRange">확인할 시간</label>
        <select id="historyRange">
            <option value="5">최근 5분</option>
            <option value="30" selected>최근 30분</option>
            <option value="60">최근 1시간</option>
        </select>
        <button id="reloadHistory" type="button">기록 불러오기</button>
    </div>
    <p id="historyNotice" aria-live="polite"></p>
    <div class="chart-surface"><canvas id="accelerationChart" role="img" aria-label="시간에 따른 세 방향의 평균 가속도와 진동 세기"></canvas></div>
    <details class="graph-guide">
        <summary>그래프 읽는 법</summary>
        <p>점 하나는 5초 동안 측정한 값을 요약한 거예요. X·Y·Z는 세 방향의 평균 가속도로 왼쪽 눈금을, 진동 세기는 오른쪽 눈금을 보면 돼요.</p>
    </details>
</section>

  "Connecting\u2026": "\uc5f0\uacb0 \uc911\u2026",
  "Connected": "\uc5f0\uacb0\ub428",
  "Reconnecting\u2026": "\ub2e4\uc2dc \uc5f0\uacb0 \uc911\u2026",
  "Starting\u2026": "\uc900\ube44 \uc911\u2026",
  "Azure settings required": "\uc11c\ubc84 \uc124\uc815 \ud544\uc694",
  "Disabled": "\uc218\uc2e0 \uaebc\uc9d0",
  "Stopped": "\uc218\uc2e0 \uc911\uc9c0",
  "Unknown": "\ud655\uc778 \ud544\uc694",
  "\ub370\uc774\ud130 \uc548\ub4e4\uc5b4\uc640\uc720": "\ucd5c\uadfc \ub370\uc774\ud130 \uc5c6\uc74c"
}</script>
<script src="/static/i18n.js"></script>
<script src="/static/cycle.js"></script>
<script src="/static/notifications.js"></script>
<script src="/static/dashboard.js"></script>

</body>
</html>
